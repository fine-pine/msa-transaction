spring.application.name=inventory
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/inventory_db
spring.datasource.username=inventory_user
spring.datasource.password=inventory_pw

spring.grpc.client.channel.account.target=static://localhost:9090

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.properties[spring.json.type.mapping]=\
  CREATE:com.example.contract.shipping.ShippingCommand$Create,\
  CANCEL:com.example.contract.shipping.ShippingCommand$Cancel,\
  CREATED:com.example.contract.shipping.ShippingReply$Created,\
  CANCELLED:com.example.contract.shipping.ShippingReply$Cancelled,\
  FAILED:com.example.contract.shipping.ShippingReply$Failed

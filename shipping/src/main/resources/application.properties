spring.application.name=shipping
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/shipping_db
spring.datasource.username=shipping_user
spring.datasource.password=shipping_pw

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.properties[spring.json.type.mapping]=\
  CREATE:com.example.contract.shipping.ShippingCommand$Create,\
  CANCEL:com.example.contract.shipping.ShippingCommand$Cancel,\
  CREATED:com.example.contract.shipping.ShippingReply$Created,\
  CANCELLED:com.example.contract.shipping.ShippingReply$Cancelled,\
  FAILED:com.example.contract.shipping.ShippingReply$Failed
spring.kafka.consumer.group-id=shipping
